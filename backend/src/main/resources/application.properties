spring.application.name=backend

# frontend .env.example의 VITE_API_BASE_URL 기본값(http://localhost:8000)과 맞춤.
# Render 등 배포 환경은 PORT 환경변수로 실제 포트를 주입하므로 그 값이 있으면 그걸 우선 사용함
server.port=${PORT:8000}

# JSON 필드명을 명세서의 snake_case(user_id, basic_profile_complete 등)에 자동으로 맞춰줌
spring.jackson.property-naming-strategy=SNAKE_CASE

# 프론트(Vite 기본 포트)에서 오는 요청을 CORS로 허용. 배포 시 프론트 실제 주소를 추가해야 함
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Supabase 프로젝트 생성 후 채울 값들 (프로젝트 설정 > Database)
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
# 스키마는 Flyway 마이그레이션(src/main/resources/db/migration)이 관리 - Hibernate는 검증만 함
spring.jpa.hibernate.ddl-auto=validate
# 상태 없는 JSON API라 뷰 렌더링 중 지연 로딩이 필요 없음
spring.jpa.open-in-view=false
# db/migration은 모든 DB 공통, db/migration-postgresql은 Postgres 전용(RLS 등) - 테스트(H2)에서는 이 두 번째 경로를 뺌
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgresql

# Supabase 프로젝트 생성 후 채울 값 (프로젝트 설정 > API > JWT Keys, 형식: https://<project>.supabase.co/auth/v1/.well-known/jwks.json)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:}
# 이 Supabase 프로젝트가 ES256(비대칭)으로 서명하도록 설정되어 있어서 필요한 값 - Spring 기본값(RS256)만 두면 검증이 항상 실패함.
# Supabase 대시보드에서 서명 알고리즘을 바꾸면 이 값도 같이 바꿔야 함
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
# 서명 검증 외에 iss/aud 클레임까지 확인 (issuer-uri는 프로젝트 설정 > API > Project URL + /auth/v1)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
